name: CI

on:
  push:
    branches: [main]
  pull_request:

# No job needs to write anything — default to read-only so a compromised
# action in the supply chain (see pinned SHAs below) has the smallest
# possible blast radius via GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test -- --coverage

      # The build never connects to Supabase (every route that reads
      # property content is server-rendered on demand, not statically
      # generated — see app/sites/[host]/[lang] in the build output). It
      # only needs lib/env.ts's validation (well-formed URLs + non-empty
      # keys) and next.config.ts's `new URL(...).hostname` to succeed, so a
      # placeholder is enough and keeps this job independent of the `db`
      # job below (no Docker, no waiting on the Supabase stack).
      - name: Build
        env:
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "ci-placeholder-service-role-key"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
          ROOT_DOMAIN: "localhost:3000"
        run: npm run build

  db:
    name: supabase db reset, pgTAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: latest

      - run: supabase start

      # Applies supabase/migrations/* + supabase/seed.sql — fails the job if
      # either has an error, same as a contributor running this locally.
      - run: supabase db reset

      - run: supabase test db

      # Real committing transactions, with no TCP credentials or dblink grants.
      # Python stdlib + psql inside the already-running local Supabase container.
      - name: Calendar concurrency (pgTAP, local socket)
        run: python3 scripts/test-calendar-concurrency.py

      - name: iCal sync concurrency (pgTAP, local socket)
        run: python3 scripts/test-ical-concurrency.py

      # SD-208: read-only HTTP smoke of the public Rates section against the
      # seeded LOCAL stack (no remote secrets, no paid services). The build
      # needs the local API URL/keys, so it is separate from the `app` job.
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build with local Supabase env
        run: |
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          set -a; . "$RUNNER_TEMP/supabase.env"; set +a
          NEXT_PUBLIC_SUPABASE_URL="$API_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_URL="$API_URL" SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          ROOT_DOMAIN="localhost:3208" npm run build

      - name: Public rates HTTP smoke (SD-208)
        run: node scripts/test-public-rates-http.mjs

      - name: Site theme HTTP smoke (SD-209)
        run: node scripts/test-site-theme-http.mjs

      # SD-209: Lighthouse MOBILE >= 90 (performance, accessibility) on the seeded
      # local tenants. Uses the Chrome preinstalled on ubuntu-latest; scores only.
      - name: Lighthouse mobile (SD-209)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/lighthouse-mobile.mjs
