name: PR risk

# SD-901: labels every PR risk:high / risk:low from the files it touches
# (scripts/lib/pr-risk.mjs) and, only for low-risk PRs, turns on GitHub
# auto-merge so it squash-merges by itself once the required CI checks pass.
#
# Security: pull_request_target runs THIS workflow as it is on main, with the
# base checkout. The PR's code is never checked out or executed here; the file
# list comes from the API. A PR therefore cannot rewrite its own classifier.
# Auto-merge stays off until the owner sets the repository variable
# AUTO_MERGE=true, which must only be done after branch protection on main
# requires the CI checks (docs/guia-dueno.md, "Configuración única").

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-risk-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify risk
    # Never act on PRs from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24

      - name: Classify changed files
        id: risk
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --jq '.[].filename' > files.txt
          risk="$(node scripts/pr-risk.mjs < files.txt)"
          echo "risk=${risk}" >> "$GITHUB_OUTPUT"
          echo "PR #${PR}: risk ${risk}"

      - name: Label
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RISK: ${{ steps.risk.outputs.risk }}
        run: |
          gh label create risk:high --color B60205 --description "Needs Claude review (+security) before merge" --force -R "$GITHUB_REPOSITORY"
          gh label create risk:low --color 0E8A16 --description "CI + implementer review; auto-merge allowed" --force -R "$GITHUB_REPOSITORY"
          other=$([ "$RISK" = high ] && echo low || echo high)
          gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "risk:${RISK}" --remove-label "risk:${other}"

      - name: Auto-merge (low risk only)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RISK: ${{ steps.risk.outputs.risk }}
          ENABLED: ${{ vars.AUTO_MERGE }}
          DRAFT: ${{ github.event.pull_request.draft }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$RISK" = low ] && [ "$ENABLED" = true ] && [ "$DRAFT" = false ]; then
            gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$HEAD"
          else
            # A new push that turned the PR high risk must cancel a pending auto-merge.
            gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --disable-auto 2>/dev/null || true
          fi
