name: Release

# SD-903: release-please reads the Conventional Commits that land on main and keeps ONE open "release PR" that bumps
# package.json and writes CHANGELOG.md. Merging that PR creates the tag vX.Y.Z and a GitHub Release.
#   main      -> the demo installation (Vercel deploys every merge).
#   vX.Y.Z    -> client installations (the owner updates a client only to a tagged version, see docs/versiones.md).
# The first stable version is forced with a commit footer "Release-As: 1.0.0" (see docs/versiones.md).

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
