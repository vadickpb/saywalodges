name: Deploy database

# Applies the migrations that were merged to main to the production Supabase
# project. It never runs on its own: the `supabase-production` environment must have
# "Required reviewers" enabled, so GitHub pauses the job until the owner clicks
# "Approve" (see docs/workflow.md → "Despliegue a producción").
#
# Agents never touch the remote database: this workflow is the only path.
#
# Required manual setup (docs/workflow.md → "Configuración única"):
#   * environment `supabase-production`: Required reviewers + "Deployment branches" = main only
#   * NOT `production`: GitHub environment names are case-insensitive and Vercel already
#     owns `Production` for its own deployments; sharing it would mix the two gates
#   * the two secrets below live ONLY in that environment, never at repo level

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, never cancelled mid-flight. GitHub keeps at most one
# *pending* run; that is fine because `db push` applies everything missing.
concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  migrate:
    name: supabase db push (production)
    # Second line of defence besides the environment's branch rule: a manual run
    # from another branch must never reach production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Pinned (CI uses `latest`): this job holds production credentials.
      # Bump deliberately when CI proves a newer CLI.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0

      # Fail early, with a clear message, if the environment is missing its secrets or variable. Never print them.
      - name: Require a configured environment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Environment supabase-production is not configured (see docs/workflow.md)"
            exit 1
          fi

      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Migrations before
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      # Shows exactly what will run. Fails if production has migrations that
      # are missing from the repo (drift), before anything is changed.
      - name: Dry run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Migrations after
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked
