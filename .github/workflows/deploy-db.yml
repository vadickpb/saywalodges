name: Deploy database

# Applies the migrations that were merged to main to the production Supabase
# project. It never runs on its own: the `production` environment must have
# "Required reviewers" enabled, so GitHub pauses the job until the owner clicks
# "Approve" (see docs/workflow.md → "Migraciones a producción").
#
# Agents never touch the remote database: this workflow is the only path.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at once, and never cancel one that is mid-flight.
concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  migrate:
    name: supabase db push (production)
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Migrations before
        run: supabase migration list --linked

      # Shows exactly what will run. Fails if production has migrations that
      # are missing from the repo (drift), before anything is changed.
      - name: Dry run
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push

      - name: Migrations after
        run: supabase migration list --linked
