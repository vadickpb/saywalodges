name: Deploy database

# Applies the migrations that were merged to main to EVERY installation listed in
# deploy/installations.json (SD-1003, ADR 0010), one matrix job per installation. Each
# installation has its own GitHub Environment with "Required reviewers", so GitHub
# pauses every job until the owner clicks "Approve" (one approval per installation;
# see docs/workflow.md → "Despliegue a producción").
#
# Agents never touch the remote database: this workflow is the only path.
#
# Required manual setup (docs/workflow.md → "Configuración única"):
#   * one environment per installation (`supabase-production` for the first one,
#     `supabase-<id>` for the rest; docs/runbook-instalacion.md → "Registrar la instalación"): Required reviewers + "Deployment branches" = main only
#   * NOT `production`: GitHub environment names are case-insensitive and Vercel already
#     owns `Production` for its own deployments; sharing it would mix the two gates
#   * the two secrets and the SUPABASE_PROJECT_ID variable live ONLY in that environment, never at repo level
#   * the registry is public: it holds only an id and the environment name, never refs or domains

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:
    inputs:
      installation:
        description: "Only this installation id from deploy/installations.json (empty = all)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

# One deployment at a time, never cancelled mid-flight. GitHub keeps at most one
# *pending* run; that is fine because `db push` applies everything missing.
concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  # Reads the registry. No environment, no secrets: it only decides which jobs exist.
  plan:
    name: plan (installations)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the matrix
        id: matrix
        env:
          # Passed through the environment, never interpolated into the script.
          INSTALLATION: ${{ inputs.installation }}
        run: echo "matrix=$(node scripts/installations-matrix.mjs)" >> "$GITHUB_OUTPUT"

  migrate:
    name: supabase db push (${{ matrix.id }})
    needs: plan
    # Second line of defence besides the environment's branch rule: a manual run
    # from another branch must never reach production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ matrix.environment }}
    strategy:
      # An installation failing or waiting for approval must not block the others, and
      # they are approved one at a time.
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Pinned (CI uses `latest`): this job holds production credentials.
      # Bump deliberately when CI proves a newer CLI.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0

      # Fail early, with a clear message, if the environment is missing its secrets or variable. Never print them.
      - name: Require a configured environment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
          ENVIRONMENT_NAME: ${{ matrix.environment }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Environment $ENVIRONMENT_NAME is not configured (see docs/workflow.md and docs/runbook-instalacion.md)"
            exit 1
          fi

      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Migrations before
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      # Shows exactly what will run. Fails if production has migrations that
      # are missing from the repo (drift), before anything is changed.
      - name: Dry run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run

      - name: Apply migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push

      - name: Migrations after
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked
